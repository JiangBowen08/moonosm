name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install official MoonBit toolchain
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Pin stable toolchain version
        run: |
          moon version --all | tee /tmp/moon-version.txt
          grep -Fq "moon 0.1.20261119" /tmp/moon-version.txt
          grep -Fq "moonc v0.10.22+124d61d05" /tmp/moon-version.txt
      - name: Check formatting
        run: moon fmt --check
      - name: Strict check
        # Keep the public Result-based parsing API; deny every other warning.
        run: moon check --deny-warn --warn-list=-78 --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: Build
        run: moon build --target ${{ matrix.target }}
      - name: Run public API examples
        run: |
          moon run --target ${{ matrix.target }} examples/decode
          moon run --target ${{ matrix.target }} examples/geojson
